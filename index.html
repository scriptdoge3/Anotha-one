<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Load Bank — 75 kW</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230e1113'/%3E%3Ctext y='23' x='16' text-anchor='middle' font-size='19'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▮▮</span>
        <span class="brand-name">LOAD BANK</span>
        <span class="brand-sub">75 kW prime</span>
      </div>
      <div class="stats" id="topStats"></div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnSave">Save</button>
        <button class="btn btn-ghost" id="btnReset">New career</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-tab="operate">Operate</button>
      <button class="tab" data-tab="contracts">Contracts</button>
      <button class="tab" data-tab="tech">Tech Tree</button>
      <button class="tab" data-tab="workshop">Workshop</button>
    </nav>

    <main>
      <section class="panel" id="panel-operate"></section>
      <section class="panel hidden" id="panel-contracts"></section>
      <section class="panel hidden" id="panel-tech"></section>
      <section class="panel hidden" id="panel-workshop"></section>
    </main>

    <div class="modal-backdrop hidden" id="modal">
      <div class="modal" id="modalBody"></div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
